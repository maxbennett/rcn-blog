ll="#568b83" opacity=".75"/><circle cx="367.52" cy="201.45" r="2" fill="#568b83" opacity=".75"/><circle cx="368.34" cy="192.55" r="2" fill="#568b83" opacity=".75"/></g><g data-map="1"><polygon points="332,186 437,172 468,191 363,205" fill="white" fill-opacity=".88" stroke="#568b83" stroke-opacity=".55" stroke-width="1"/><circle cx="404.29" cy="193.48" r="2" fill="#568b83" opacity=".75"/><circle cx="430.26" cy="183.54" r="2" fill="#568b83" opacity=".75"/><circle cx="347.08" cy="185.84" r="2" fill="#568b83" opacity=".75"/></g><g data-map="0"><polygon points="332,179 437,165 468,184 363,198" fill="white" fill-opacity=".88" stroke="#568b83" stroke-opacity=".55" stroke-width="1"/><circle cx="383.03" cy="186.77" r="2" fill="#568b83" opacity=".75"/><circle cx="409.00" cy="176.83" r="2" fill="#568b83" opacity=".75"/><circle cx="434.62" cy="183.13" r="2" fill="#568b83" opacity=".75"/></g><text x="24" y="185" class="label">Level 2 feature maps</text><text x="24" y="204" class="example">Contours</text></g><g data-level="3"><g data-map="2"><polygon points="332,115 437,101 468,120 363,134" fill="white" fill-opacity=".88" stroke="#a08754" stroke-opacity=".55" stroke-width="1"/><circle cx="427.32" cy="117.79" r="2" fill="#a08754" opacity=".75"/><circle cx="364.07" cy="113.50" r="2" fill="#a08754" opacity=".75"/></g><g data-map="1"><polygon points="332,108 437,94 468,113 363,127" fill="white" fill-opacity=".88" stroke="#a08754" stroke-opacity=".55" stroke-width="1"/><circle cx="406.06" cy="111.08" r="2" fill="#a08754" opacity=".75"/><circle cx="367.61" cy="121.99" r="2" fill="#a08754" opacity=".75"/></g><g data-map="0"><polygon points="332,101 437,87 468,106 363,120" fill="white" fill-opacity=".88" stroke="#a08754" stroke-opacity=".55" stroke-width="1"/><circle cx="384.80" cy="104.37" r="2" fill="#a08754" opacity=".75"/><circle cx="430.35" cy="104.08" r="2" fill="#a08754" opacity=".75"/></g><text x="24" y="107" class="label">Level 3 feature maps</text><text x="24" y="126" class="ex