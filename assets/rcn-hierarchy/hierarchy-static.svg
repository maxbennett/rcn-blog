<svg xmlns="http://www.w3.org/2000/svg" width="560" height="304" viewBox="0 0 560 304" role="img" aria-labelledby="title desc">
<title id="title">Multi-layered RCN</title>
<desc id="desc">Read upward. Separate strokes become an open corner and arc, then a closed triangle and loop. Beside these examples, dots on three stacks of maps mark detected locations. At the top, the digits 0, 4, and 9 reuse those shapes; small rings on each digit show example landmark pools.</desc>
