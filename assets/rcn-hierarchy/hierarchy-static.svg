<svg xmlns="http://www.w3.org/2000/svg" width="560" height="304" viewBox="0 0 560 304" role="img" aria-labelledby="title desc">
<title id="title">Multi-layered RCN</title>
<desc id="desc">A compact hierarchy, read from bottom to top: Level 1 feature maps, edges; Level 2 feature maps, contours; Level 3 feature maps, shapes; landmark pools for each exemplar, whole objects. Simple upward arrows connect the levels. Each feature-map stack contains dots marking activations. Feature categories and pool symbols are illustrative, with detailed connections omitted.</desc>
<defs><marker id="up" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1L5 3.5L1 6" fill="none" stroke="#8ba59a" stroke-width="1.2"/></marker></defs>
